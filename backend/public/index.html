<!--
  CLINICFLOW — Clinic Appointment & Management App
  --------------------------------------------------
  Full-stack build: this page is the frontend only. It talks to the
  Express + SQLite backend in /backend over the REST API under /api/*.
  Real login (JWT) has replaced the old "pick any role" dropdown:
    - Staff sign in with a username + password (see backend/db/seed.js
      for the default demo accounts).
    - Patients sign in by registering (new patient) or verifying an
      OTP sent to their mobile (returning patient) — OTP is simulated
      in dev mode (see backend/services/otp.js) and shown on screen.
  Nothing here is stored in memory only — every action is persisted to
  the SQLite database by the backend.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClinicFlow — Appointment & Clinic Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --teal:#0F766E; --teal-d:#115E59; --teal-l:#CCFBF1;
    --bg:#EEF3F2; --card:#FFFFFF; --border:#DCE6E3; --border-d:#C4D3CF;
    --ink:#14342F; --muted:#5E7772; --muted-l:#8AA39D;
    --booked:#0EA5E9; --wait:#D97706; --pharm:#7C3AED; --treat:#0891B2;
    --pay:#EA580C; --done:#16A34A; --alert:#DC2626;
    --amber-bg:#FEF6E7; --amber-br:#F0B429;
    --radius:12px; --shadow:0 1px 2px rgba(20,52,47,.06),0 4px 14px rgba(20,52,47,.06);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5}
  .mono{font-family:'IBM Plex Mono',monospace}
  button{font-family:inherit;cursor:pointer;border:none;background:none;font-size:14px}
  input,select,textarea{font-family:inherit;font-size:14px;width:100%;padding:9px 11px;border:1px solid var(--border-d);border-radius:8px;background:#fff;color:var(--ink)}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--teal-l);border-color:var(--teal)}
  label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px}
  a{color:var(--teal)}

  /* ---- layout ---- */
  .topbar{height:58px;background:var(--teal-d);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:40}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;letter-spacing:.2px}
  .brand .dot{width:11px;height:11px;border-radius:3px;background:#5EEAD4;box-shadow:0 0 0 4px rgba(94,234,212,.25)}
  .brand img.logo-img{height:28px;max-width:160px;object-fit:contain;display:block}
  .brand-lg img.logo-img{height:40px;max-width:220px;object-fit:contain;display:block}
  .logo-preview{height:52px;max-width:220px;object-fit:contain;display:block;margin-bottom:12px;border:1px solid var(--border);border-radius:8px;padding:8px;background:#fff}
  .topbar-r{display:flex;align-items:center;gap:14px;font-size:13px}
  .topbar-r .date{color:#A7F3D6}
  .role-pick{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);padding:5px 8px 5px 12px;border-radius:9px}
  .role-pick select{background:transparent;border:none;color:#fff;font-weight:600;padding:2px 4px;width:auto}
  .role-pick select:focus{outline:none}
  .role-pick select option{color:#14342F}
  .logout-btn{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25);padding:7px 13px;border-radius:9px;font-weight:600}
  .logout-btn:hover{background:rgba(255,255,255,.22)}

  .shell{display:flex;min-height:calc(100vh - 58px)}
  .nav{width:210px;background:#fff;border-right:1px solid var(--border);padding:14px 10px;flex-shrink:0}
  .nav .grp{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--muted-l);padding:12px 10px 6px}
  .nav a{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:9px;color:var(--ink);text-decoration:none;font-weight:500;margin-bottom:2px;cursor:pointer}
  .nav a:hover{background:var(--bg)}
  .nav a.on{background:var(--teal);color:#fff}
  .nav a.on svg{stroke:#fff}
  .nav svg{width:17px;height:17px;stroke:var(--muted);flex-shrink:0}
  .nav .badge{margin-left:auto;background:var(--pay);color:#fff;font-size:11px;font-weight:700;border-radius:20px;padding:1px 7px}
  .nav a.on .badge{background:rgba(255,255,255,.25)}
  .shell.logged-out .nav{display:none}
  .shell.logged-out main{max-width:none;display:flex;justify-content:center;padding-top:64px}

  main{flex:1;padding:24px 28px;max-width:1240px}
  .page-h{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:12px}
  .page-h h1{font-size:22px;font-weight:700}
  .page-h p{color:var(--muted);font-size:13px;margin-top:2px}

  /* ---- cards / grid ---- */
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
  .card-h{padding:14px 18px;border-bottom:1px solid var(--border);font-weight:600;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .card-b{padding:18px}
  .grid{display:grid;gap:16px}
  .g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)} .g5{grid-template-columns:repeat(5,1fr)}
  @media(max-width:900px){.g2,.g3,.g4,.g5{grid-template-columns:1fr}.nav{width:64px}.nav .label,.nav .grp,.nav .badge{display:none}}

  .stat{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
  .stat .k{font-size:12px;color:var(--muted);font-weight:600}
  .stat .v{font-size:26px;font-weight:700;margin-top:4px}
  .stat .v.mono{font-size:23px}
  .stat.warn{border-color:#F5D9A8;background:var(--amber-bg)}
  .stat.danger{border-color:#F3C9C9;background:#FDF0F0}

  /* ---- table ---- */
  table{width:100%;border-collapse:collapse}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700;padding:10px 14px;border-bottom:1px solid var(--border);background:#F7FAF9}
  td{padding:11px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
  tr:last-child td{border-bottom:none}
  tr.hl td{background:var(--amber-bg)}
  tr.hl td:first-child{box-shadow:inset 3px 0 0 var(--amber-br)}
  .t-wrap{overflow-x:auto}

  /* ---- chips / buttons ---- */
  .chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap;letter-spacing:.2px}
  .chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
  .c-booked{color:var(--booked);background:#E0F2FE} .c-wait{color:var(--wait);background:#FEF3E2}
  .c-pharm{color:var(--pharm);background:#F3E8FF} .c-treat{color:var(--treat);background:#E0F5FA}
  .c-pay{color:var(--pay);background:#FEECDD} .c-done{color:var(--done);background:#DCFCE7}
  .c-cancel{color:var(--muted);background:#EEF2F1}
  .tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--teal-l);color:var(--teal-d)}
  .tag.red{background:#FDE7E7;color:var(--alert)} .tag.amber{background:#FEF3E2;color:var(--wait)}

  .btn{display:inline-flex;align-items:center;gap:7px;background:var(--teal);color:#fff;font-weight:600;padding:9px 15px;border-radius:9px;transition:.12s}
  .btn:hover{background:var(--teal-d)}
  .btn.sm{padding:6px 11px;font-size:13px}
  .btn.ghost{background:#fff;color:var(--teal);border:1px solid var(--border-d)}
  .btn.ghost:hover{background:var(--bg)}
  .btn.gray{background:#fff;color:var(--ink);border:1px solid var(--border-d)} .btn.gray:hover{background:var(--bg)}
  .btn.danger{background:#fff;color:var(--alert);border:1px solid #F3C9C9} .btn.danger:hover{background:#FDF0F0}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn svg{width:15px;height:15px;stroke:currentColor;fill:none}

  .empty{text-align:center;padding:44px 20px;color:var(--muted)}
  .empty svg{width:34px;height:34px;stroke:var(--muted-l);margin-bottom:8px}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
  .seg{display:inline-flex;background:#fff;border:1px solid var(--border-d);border-radius:9px;overflow:hidden}
  .seg button{padding:7px 14px;font-weight:600;color:var(--muted)}
  .seg button.on{background:var(--teal);color:#fff}
  .token{font-family:'IBM Plex Mono',monospace;font-weight:600;background:var(--ink);color:#fff;border-radius:7px;padding:3px 9px;font-size:13px}

  /* ---- modal ---- */
  .overlay{position:fixed;inset:0;background:rgba(20,52,47,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:60;overflow-y:auto}
  .modal{background:#fff;border-radius:14px;width:100%;max-width:640px;box-shadow:0 20px 60px rgba(0,0,0,.25);animation:pop .16s ease}
  .modal.wide{max-width:860px}
  @keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
  .modal-h{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
  .modal-h h3{font-size:17px}
  .modal-h .x{width:30px;height:30px;border-radius:8px;color:var(--muted);font-size:20px;line-height:1}
  .modal-h .x:hover{background:var(--bg)}
  .modal-b{padding:20px;max-height:70vh;overflow-y:auto}
  .modal-f{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px}
  .field{margin-bottom:14px}
  .row{display:flex;gap:12px}.row>*{flex:1}
  .rx-line{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 70px 30px;gap:8px;align-items:end;margin-bottom:10px}
  @media(max-width:700px){.rx-line{grid-template-columns:1fr 1fr;}}

  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .cal-head{margin-bottom:6px;font-size:12px;font-weight:600;color:var(--muted);text-align:center}
  .cal-cell{min-height:74px;border:1px solid var(--border);border-radius:8px;padding:6px;cursor:pointer;transition:background .1s}
  .cal-cell:hover{background:var(--teal-l)}
  .cal-cell.cal-blank{border:none;cursor:default;background:none}
  .cal-cell.cal-blank:hover{background:none}
  .cal-cell.cal-today{border-color:var(--teal);border-width:2px}
  .cal-daynum{font-size:13px;font-weight:600}
  .cal-count{margin-top:4px;font-size:11px;color:#fff;background:var(--teal);border-radius:999px;padding:2px 7px;display:inline-block}
  @media(max-width:700px){.cal-cell{min-height:50px;font-size:11px}.cal-count{font-size:10px;padding:1px 5px}}

  .timeline{border-left:2px solid var(--border);margin-left:6px;padding-left:16px}
  .tl-item{position:relative;margin-bottom:18px}
  .tl-item::before{content:"";position:absolute;left:-23px;top:3px;width:11px;height:11px;border-radius:50%;background:var(--teal);border:2px solid #fff}
  .tl-date{font-size:12px;font-weight:700;color:var(--teal-d)}
  .tl-body{font-size:13px;color:var(--muted);margin-top:3px}
  .tl-body b{color:var(--ink)}

  .kv{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--border)}
  .kv .k{color:var(--muted)}
  .note{background:var(--teal-l);border:1px solid #9EE6DC;color:var(--teal-d);padding:10px 13px;border-radius:9px;font-size:12.5px;margin-bottom:14px}
  .note.warn{background:var(--amber-bg);border-color:#F5D9A8;color:#92600b}

  /* ---- login ---- */
  .login-card{width:100%;max-width:400px;background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:30px;align-self:flex-start}
  .brand-lg{display:flex;align-items:center;gap:10px;font-weight:700;font-size:21px;color:var(--teal-d);margin-bottom:4px}
  .brand-lg .dot{width:13px;height:13px;border-radius:4px;background:var(--teal);box-shadow:0 0 0 4px var(--teal-l)}
  .login-sub{color:var(--muted);font-size:13px;margin-bottom:20px}
  .login-hint{font-size:11.5px;color:var(--muted-l);margin-top:16px;line-height:1.7}
  .err{background:#FDF0F0;border:1px solid #F3C9C9;color:var(--alert);padding:9px 12px;border-radius:8px;font-size:12.5px;margin-bottom:14px}

  /* bill print */
  .bill{font-family:'IBM Plex Mono',monospace;font-size:13px}
  .bill h4{font-family:Inter;font-size:16px}
  @media print{
    body *{visibility:hidden}
    .print-area,.print-area *{visibility:visible}
    .print-area{position:absolute;left:0;top:0;width:100%;padding:20px}
    .no-print{display:none!important}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand" id="brandBox"><span class="dot"></span> ClinicFlow</div>
  <div class="topbar-r" id="topbarR"></div>
</div>

<div class="shell" id="shell">
  <nav class="nav" id="nav"></nav>
  <main id="main"></main>
</div>

<div id="modalRoot"></div>

<script>
/* ==========================================================================
   HELPERS
   ========================================================================== */
const $ = s => document.querySelector(s);
const esc = s => (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad = n => String(n).padStart(2,'0');
function todayISO(){const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function addDays(iso,n){const d=new Date(iso+'T00:00');d.setDate(d.getDate()+n);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function fmtDate(iso){if(!iso)return '—';const d=new Date(iso+(iso.length===10?'T00:00':''));return d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})}
function fmtDT(ms){return new Date(ms).toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}
const money = n => '₹'+Number(n||0).toLocaleString('en-IN',{minimumFractionDigits:0,maximumFractionDigits:2});
function daysUntil(iso){return Math.round((new Date(iso+'T00:00')-new Date(todayISO()+'T00:00'))/864e5)}

/* ==========================================================================
   API CLIENT — talks to the Express backend under /api/*
   ========================================================================== */
const API_BASE = '/api';
let session = null; // {kind:'staff'|'patient', token, name, role, id, mobile}

function loadSession(){ try{ const raw=localStorage.getItem('cf_session'); if(raw) session=JSON.parse(raw); }catch(e){ session=null; } }
function saveSession(s){ session=s; try{ localStorage.setItem('cf_session', JSON.stringify(s)); }catch(e){} }
function clearSession(){ session=null; try{ localStorage.removeItem('cf_session'); }catch(e){} }

async function api(method, path, body){
  const headers = {'Content-Type':'application/json'};
  if(session && session.token) headers['Authorization'] = 'Bearer ' + session.token;
  let res;
  try{
    res = await fetch(API_BASE+path, {method, headers, body: body!==undefined ? JSON.stringify(body) : undefined});
  }catch(e){
    throw new Error('Could not reach the server. Is the backend running?');
  }
  let data = null;
  try{ data = await res.json(); }catch(e){ /* empty body */ }
  if(!res.ok){
    if(res.status===401 && session){ clearSession(); render(); }
    throw new Error((data && data.error) || `Request failed (${res.status})`);
  }
  return data;
}
const apiGet   = p => api('GET', p);
const apiPost  = (p,b) => api('POST', p, b);
const apiPut   = (p,b) => api('PUT', p, b);
const apiPatch = (p,b) => api('PATCH', p, b);

/* ==========================================================================
   NAV / ICONS
   ========================================================================== */
const NAV = {
  patient:[['book','My Appointments','cal']],
  reception:[['desk','Front Desk','list'],['pay','Collect Payments','cash'],['patients','Patient Directory','users'],['calendar','Calendar','cal']],
  doctor:[['queue','Consultation Queue','steth'],['calendar','Calendar','cal']],
  pharmacy:[['pqueue','Prescription Queue','pill'],['inventory','Inventory','box'],['calendar','Calendar','cal']],
  treatment:[['tqueue','Treatment Queue','spark'],['calendar','Calendar','cal']],
  admin:[['dash','Dashboard','chart'],['treat','Treatment Master','spark'],['inventory','Inventory','box'],['users','Users & Roles','users'],['calendar','Calendar','cal'],['settings','Settings','gear']],
};
const ICON = {
  cal:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
  list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
  cash:'<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/>',
  users:'<circle cx="9" cy="8" r="3.5"/><path d="M2 21c0-3.5 3-5.5 7-5.5s7 2 7 5.5"/><path d="M17 8a3.5 3.5 0 0 1 0 7"/>',
  steth:'<path d="M5 3v6a5 5 0 0 0 10 0V3"/><path d="M10 14v2a5 5 0 0 0 10 0v-2"/><circle cx="20" cy="10" r="2"/>',
  pill:'<rect x="3" y="9" width="18" height="6" rx="3" transform="rotate(-45 12 12)"/><path d="M12 5 19 12"/>',
  box:'<path d="M3 8l9-5 9 5v8l-9 5-9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/>',
  spark:'<path d="M12 3v6M12 15v6M3 12h6M15 12h6M6 6l3 3M15 15l3 3M18 6l-3 3M9 15l-3 3"/>',
  chart:'<path d="M3 3v18h18"/><path d="M7 15l4-5 4 3 4-6"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
};
function svgNav(k){return `<svg viewBox="0 0 24 24" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${ICON[k]}</svg>`}
function roleLabel(r){return {patient:'Patient',reception:'Reception',doctor:'Doctor',pharmacy:'Pharmacy',treatment:'Treatment Centre',admin:'Administration'}[r]||r}

/* ---- status chip ---- */
function chip(s){
  const m={'Booked':'c-booked','Checked-in':'c-wait','With Doctor':'c-wait','In Pharmacy':'c-pharm','In Treatment':'c-treat','Awaiting Payment':'c-pay','Completed':'c-done','Cancelled':'c-cancel','No-show':'c-cancel'};
  return `<span class="chip ${m[s]||'c-cancel'}">${s}</span>`;
}
function emptyRow(msg){return `<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.6"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/></svg><div>${msg}</div></div>`}
function purposeSel(id,val){return `<select id="${id}">${['Skin Issue','Hair Issue','Treatment','Others'].map(o=>`<option ${o===val?'selected':''}>${o}</option>`).join('')}</select>`}
function slotSel(id){let o='';for(let h=10;h<=18;h++)for(const m of['00','30'])o+=`<option>${pad(h)}:${m}</option>`;return `<select id="${id}">${o}</select>`}
function groupQty(inv,name){return inv.filter(i=>i.name===name).reduce((s,i)=>s+i.qty,0)}
function distinctNames(inv){return [...new Set(inv.map(i=>i.name))]}

/* ==========================================================================
   MODAL
   ========================================================================== */
function modal(title,body,footer,cls){
  $('#modalRoot').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal ${cls||''}"><div class="modal-h"><h3>${title}</h3><button class="x" onclick="closeModal()">×</button></div>
    <div class="modal-b">${body}</div>${footer?`<div class="modal-f">${footer}</div>`:''}</div></div>`;
}
function closeModal(){$('#modalRoot').innerHTML=''}

/* ==========================================================================
   APP STATE + BOOT
   ========================================================================== */
const state = { view:null, recFilter:'today', loginTab:'patient' };
let pendingDueCount = 0;
let branding = { clinicName:'ClinicFlow', logoUrl:'', accentColor:'' };

function brandHTML(size){
  const cls = size==='lg' ? 'logo-img' : 'logo-img';
  if(branding.logoUrl) return `<img class="${cls}" src="${esc(branding.logoUrl)}" alt="${esc(branding.clinicName)}">`;
  return `<span class="dot"></span> ${esc(branding.clinicName)}`;
}

/* -- Accent color theming --------------------------------------------------
   The app's default accent is --teal (plus the --teal-d / --teal-l shades
   derived from it for hover states and light tints). A clinic's branding
   can override just this accent family — auto-detected from their logo on
   upload, or set manually in Settings — without touching layout/background
   colors, which stay consistent across every clinic. */
const DEFAULT_ACCENT = '#0F766E';

function hexToRgb(hex){
  const m = /^#?([0-9a-f]{6})$/i.exec(hex || '');
  const n = m ? parseInt(m[1], 16) : parseInt(DEFAULT_ACCENT.slice(1), 16);
  return [(n>>16)&255, (n>>8)&255, n&255];
}
function mix(rgb, target, amt){ return rgb.map((v,i)=> v + (target[i]-v)*amt); }
function rgbToHex(rgb){
  return '#' + rgb.map(v => Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
}
function applyAccentColor(hex){
  const base = (hex && /^#[0-9a-f]{6}$/i.test(hex)) ? hex : DEFAULT_ACCENT;
  const rgb = hexToRgb(base);
  const root = document.documentElement.style;
  root.setProperty('--teal', base);
  root.setProperty('--teal-d', rgbToHex(mix(rgb, [0,0,0], 0.18)));   // hover/pressed shade
  root.setProperty('--teal-l', rgbToHex(mix(rgb, [255,255,255], 0.88))); // light tint (chips, focus rings)
}

function go(v){ state.view=v; render(); }
function logout(){ clearSession(); state.view=null; closeModal(); render(); }

async function render(){
  const dateStr = new Date().toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'long',year:'numeric'});
  const shell = $('#shell'), nav = $('#nav'), main = $('#main'), topbarR = $('#topbarR');
  const box = $('#brandBox'); if(box) box.innerHTML = brandHTML();

    nav.innerHTML='';
    topbarR.innerHTML = `<span class="date">${dateStr}</span>`;
    main.innerHTML = loginScreenHTML();
    return;
  }

  const roleKey = session.kind==='patient' ? 'patient' : session.role;
  if(roleKey==='reception'){ try{ pendingDueCount = (await apiGet('/billing/due')).length; }catch(e){ pendingDueCount=0; } }
  topbarR.innerHTML = `<span class="date">${dateStr}</span>

      <span style="opacity:.75;font-size:11.5px">· ${roleLabel(roleKey)}</span>
    </div>

  const items = NAV[roleKey];
  nav.innerHTML = `<div class="grp">${roleLabel(roleKey)}</div>` + items.map(([v,label,ic])=>{
    const badge = (roleKey==='reception'&&v==='pay'&&pendingDueCount)?`<span class="badge">${pendingDueCount}</span>`:'';
    return `<a class="${state.view===v?'on':''}" onclick="go('${v}')">${svgNav(ic)}<span class="label">${esc(label)}</span>${badge}</a>`;
  }).join('');

  main.innerHTML = '<div class="empty">Loading…</div>';
  const VIEWS = { book:viewPatientHome, desk:viewDesk, pay:viewPay, patients:viewPatients, queue:viewDoctorQueue,
    pqueue:viewPharmacy, inventory:viewInventory, tqueue:viewTreatment, dash:viewDash, treat:viewTreatMaster,
    users:viewUsers, settings:viewSettings, calendar:viewCalendar };
  const fn = VIEWS[state.view];
  if(!fn){ main.innerHTML = emptyRow('Select a view from the left.'); return; }
  try{
    main.innerHTML = await fn();
  }catch(e){
    main.innerHTML = `<div class="card"><div class="card-b">${emptyRow('Could not load this page: '+esc(e.message))}</div></div>`;
  }
}

/* ==========================================================================
   VIEW: CALENDAR (every staff role) — past, today and upcoming appointments
   ========================================================================== */
let calMonthCursor = null; // 'YYYY-MM'
let calMonthCache = [];
function calMonthLabel(ym){
  const [y,m] = ym.split('-').map(Number);
  return new Date(y, m-1, 1).toLocaleDateString('en-IN',{month:'long',year:'numeric'});
}
function calShiftMonth(ym, delta){
  let [y,m] = ym.split('-').map(Number);
  m += delta;
  if(m<1){ m=12; y--; }
  if(m>12){ m=1; y++; }
  return `${y}-${String(m).padStart(2,'0')}`;
}
async function viewCalendar(){
  if(!calMonthCursor) calMonthCursor = todayISO().slice(0,7);
  const data = await apiGet(`/appointments/calendar?month=${calMonthCursor}`);
  calMonthCache = data.appointments;

  const byDate = {};
  calMonthCache.forEach(a=>{ (byDate[a.date] = byDate[a.date]||[]).push(a); });

  const [y,m] = calMonthCursor.split('-').map(Number);
  const firstDow = new Date(y, m-1, 1).getDay(); // 0 = Sunday
  const daysInMonth = new Date(y, m, 0).getDate();
  const todayStr = todayISO();

  let cells = '';
  for(let i=0;i<firstDow;i++) cells += `<div class="cal-cell cal-blank"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const dateStr = `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const list = byDate[dateStr]||[];
    cells += `<div class="cal-cell${dateStr===todayStr?' cal-today':''}" onclick="calOpenDay('${dateStr}')">
      <div class="cal-daynum">${d}</div>
      ${list.length?`<div class="cal-count">${list.length} appt${list.length>1?'s':''}</div>`:''}
    </div>`;
  }

  const canCreate = session && session.kind==='staff' && ['reception','admin'].includes(session.role);

  return `<div class="page-h"><div><h1>Appointment calendar</h1><p>Every staff member can see current, past and upcoming appointments here. Click a date to see details.</p></div>
    ${canCreate?`<button class="btn" onclick="deskBook()">+ Create appointment</button>`:''}</div>
    <div class="card"><div class="card-b">
      <div class="row" style="justify-content:space-between;align-items:center;margin-bottom:14px">
        <button class="btn gray sm" onclick="calShift(-1)">‹ Prev</button>
        <b style="font-size:16px">${calMonthLabel(calMonthCursor)}</b>
        <button class="btn gray sm" onclick="calShift(1)">Next ›</button>
      </div>
      <div class="cal-grid cal-head">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div>${d}</div>`).join('')}</div>
      <div class="cal-grid">${cells}</div>
    </div></div>`;
}
function calShift(delta){ calMonthCursor = calShiftMonth(calMonthCursor, delta); render(); }
function calOpenDay(dateStr){
  const list = (calMonthCache||[]).filter(a=>a.date===dateStr).sort((a,b)=>a.slot.localeCompare(b.slot));
  const rows = list.map(a=>{const p=a.patient;
    return `<tr><td>${esc(a.slot)}</td><td><b>${esc(p.name)}</b><div class="mono" style="font-size:11px;color:var(--muted)">${esc(p.mobile)}</div></td>
      <td><span class="tag">${esc(a.purpose)}</span></td><td>${chip(a.status)}</td></tr>`;
  }).join('');
  modal(`Appointments — ${fmtDate(dateStr)}`,`
    <div class="t-wrap"><table><thead><tr><th>Slot</th><th>Patient</th><th>Reason / issue</th><th>Status</th></tr></thead>
    <tbody>${rows||`<tr><td colspan="4">${emptyRow('No appointments booked on this date.')}</td></tr>`}</tbody></table></div>`,
    `<button class="btn gray" onclick="closeModal()">Close</button>`,'wide');
}

  try{
    const {patient:p, visits, totals} = await apiGet(`/patients/${pid}/history`);
    const tl = visits.map(v=>{
      const a=v.appointment, rx=v.prescriptions;
      return `<div class="tl-item">
        <div class="tl-date">${fmtDate(a?a.date:todayISO())} · Dr visit</div>
        <div class="tl-body">
          <div><b>Complaints:</b> ${esc(v.complaints)||'—'}</div>
          <div><b>Observations:</b> ${esc(v.observations)||'—'}</div>
          <div><b>Diagnosis:</b> ${esc(v.diagnosis)||'—'}</div>
          ${v.tests?`<div><b>Tests:</b> ${esc(v.tests)}</div>`:''}
          ${v.treatmentReco?`<div><b>Treatment advised:</b> ${esc(v.treatmentReco)}</div>`:''}
          ${rx.length?`<div style="margin-top:6px"><b>Prescription:</b><ul style="margin:4px 0 0 18px">${rx.map(r=>`<li>${esc(r.name)} — ${esc(r.dosage)} · ${esc(r.freq)} · ${esc(r.duration)} (${esc(r.food)}) × ${r.qty}${r.notInStock?' <span class="tag amber">Not in our pharmacy</span>':''}</li>`).join('')}</ul></div>`:''}
          ${v.nextVisit?`<div style="margin-top:4px"><b>Next visit:</b> ${fmtDate(v.nextVisit)}</div>`:''}
        </div></div>`;
    }).join('') || emptyRow('No clinical history yet.');
    modal(`History — ${esc(p.name)}`,`
      <div class="grid g3" style="margin-bottom:18px">
        <div class="stat"><div class="k">Mobile</div><div class="v mono" style="font-size:18px">${esc(p.mobile)}</div></div>
        <div class="stat"><div class="k">Total billed (paid)</div><div class="v mono">${money(totals.paid)}</div></div>
        <div class="stat ${totals.due?'danger':''}"><div class="k">Outstanding</div><div class="v mono">${money(totals.due)}</div></div>

      <h4 style="margin-bottom:12px">Clinical timeline</h4>
      <div class="timeline">${tl}</div>`,
      `<button class="btn" onclick="closeModal()">Close</button>`,'wide');
  }catch(e){ modal('History', `<div class="err">${esc(e.message)}</div>`, `<button class="btn" onclick="closeModal()">Close</button>`); }
}

let rxLines=[], consultInv=[], consultTreatments=[];
async function consult(aid){
  const a = doctorQueueCache.find(x=>x.id===aid); if(!a) return;

  try{
    [consultInv, consultTreatments] = await Promise.all([apiGet('/inventory'), apiGet('/treatments')]);
  }catch(e){ alert(e.message); return; }

    <div class="field"><label>Patient complaints</label><textarea id="c-comp" rows="2" placeholder="Presenting complaints..."></textarea></div>
    <div class="field"><label>Doctor's observations</label><textarea id="c-obs" rows="2"></textarea></div>
    <div class="field"><label>Diagnosis</label><input id="c-diag"></div>
    <div class="field"><label>Prescription</label><div id="rxBox"></div>
      <button class="btn ghost sm" onclick="rxAdd()">+ Add medicine</button></div>
    <div class="row"><div class="field"><label>Tests required (optional)</label><input id="c-tests" placeholder="e.g. CBC, KOH mount"></div>
      <div class="field"><label>Treatment recommendation</label>
        <select id="c-treat"><option value="">None</option>${consultTreatments.map(t=>`<option value="${esc(t.name)}">${esc(t.name)}</option>`).join('')}</select></div></div>

    `<button class="btn gray" onclick="closeModal()">Cancel</button><button class="btn" onclick="consultSave('${aid}')">Save & send to queue</button>`,'wide');
  renderRx();
}
function rxAdd(){rxLines.push({freqPreset:'', durationUnit:'days'});renderRx()}
function rxDel(i){rxLines.splice(i,1);renderRx()}

/* Frequency presets follow the standard morning-afternoon-night convention
   (e.g. "1-0-1" = one dose morning + one at night = 2 doses/day). Only
   these numeric presets support auto-calculating quantity; SOS/Custom
   don't have a fixed doses-per-day, so quantity stays a manual entry. */
const RX_FREQ_PRESETS=[
  ['1-0-1','1-0-1 · Morning & Night'],
  ['1-1-1','1-1-1 · Thrice daily'],
  ['1-0-0','1-0-0 · Morning only'],
  ['0-1-0','0-1-0 · Afternoon only'],
  ['0-0-1','0-0-1 · Night only'],
  ['1-1-0','1-1-0 · Morning & Afternoon'],
  ['0-1-1','0-1-1 · Afternoon & Night'],
  ['2-0-2','2-0-2 · Morning & Night (2 each)'],
  ['SOS','SOS · As needed'],
  ['custom','Custom…'],
];
const RX_DURATION_UNITS=[['days','Day(s)'],['weeks','Week(s)'],['months','Month(s)']];

function rxFreqDosesPerDay(preset){
  if(!preset || preset==='SOS' || preset==='custom') return null;
  const parts=preset.split('-').map(Number);
  if(parts.length!==3 || parts.some(n=>isNaN(n))) return null;
  return parts.reduce((a,b)=>a+b,0);
}
function rxDurationDays(num,unit){
  const n=+num;
  if(!n || n<=0) return null;
  return n*(unit==='weeks'?7:unit==='months'?30:1);
}
function rxUnitLabel(n,unit){
  const map={days:['day','days'], weeks:['week','weeks'], months:['month','months']};
  const [s,p]=map[unit]||map.days;
  return (+n===1)?s:p;
}
function rxRecalcQty(i){
  const l=rxLines[i];
  const perDay=rxFreqDosesPerDay(l.freqPreset);
  const days=rxDurationDays(l.durationNum,l.durationUnit||'days');
  if(perDay!=null && days!=null) l.qty=perDay*days;
}
function rxSetFreq(i,val){ rxLines[i].freqPreset=val; rxRecalcQty(i); renderRx(); }
function rxSetFreqCustom(i,val){ rxLines[i].freqCustomText=val; }
function rxSetDurationNum(i,val){ rxLines[i].durationNum=val; rxRecalcQty(i); renderRx(); }
function rxSetDurationUnit(i,val){ rxLines[i].durationUnit=val; rxRecalcQty(i); renderRx(); }
function rxToggleStock(i,checked){ rxLines[i].notInStock=checked; rxLines[i].name=''; renderRx(); }

function renderRx(){
  const optsFor=(l)=>distinctNames(consultInv).map(n=>`<option value="${esc(n)}" ${l.name===n?'selected':''}>${esc(n)} (stock ${groupQty(consultInv,n)})</option>`).join('');
  $('#rxBox').innerHTML=rxLines.map((l,i)=>{
    const autoCalc = rxFreqDosesPerDay(l.freqPreset)!=null && rxDurationDays(l.durationNum,l.durationUnit)!=null;
    return `
    <div class="rx-line">
      <div><label>Medicine</label>
        ${l.notInStock
          ? `<input placeholder="Medicine name" value="${esc(l.name||'')}" oninput="rxLines[${i}].name=this.value">`
          : `<select onchange="rxLines[${i}].name=this.value"><option value="">Select…</option>${optsFor(l)}</select>`}
      </div>
      <div><label>Dosage</label><input placeholder="1 tab" value="${esc(l.dosage||'')}" oninput="rxLines[${i}].dosage=this.value"></div>
      <div><label>Frequency</label>
        <select onchange="rxSetFreq(${i},this.value)">
          <option value="">Select…</option>
          ${RX_FREQ_PRESETS.map(([v,label])=>`<option value="${v}" ${l.freqPreset===v?'selected':''}>${esc(label)}</option>`).join('')}
        </select>
        ${l.freqPreset==='custom'?`<input style="margin-top:6px" placeholder="e.g. every 6 hours" value="${esc(l.freqCustomText||'')}" oninput="rxSetFreqCustom(${i},this.value)">`:''}
      </div>
      <div><label>Duration</label>
        <div style="display:flex;gap:6px">
          <input type="number" min="1" placeholder="5" value="${l.durationNum||''}" style="width:64px" oninput="rxSetDurationNum(${i},this.value)">
          <select onchange="rxSetDurationUnit(${i},this.value)">${RX_DURATION_UNITS.map(([v,label])=>`<option value="${v}" ${(l.durationUnit||'days')===v?'selected':''}>${label}</option>`).join('')}</select>
        </div>
      </div>
      <div><label>Qty${autoCalc?' (auto)':''}</label><input type="number" min="1" placeholder="0" value="${l.qty||''}" oninput="rxLines[${i}].qty=+this.value"></div>
      <div><button class="btn danger sm" style="padding:9px 10px" onclick="rxDel(${i})">✕</button></div>
    </div>
    <label style="display:flex;align-items:center;gap:6px;margin:-4px 0 12px;font-weight:400;font-size:12px;color:var(--muted)">
      <input type="checkbox" style="width:auto" ${l.notInStock?'checked':''} onchange="rxToggleStock(${i},this.checked)"> Not in our pharmacy — patient will buy this elsewhere
    </label>`;
  }).join('') || '<div style="color:var(--muted);font-size:13px;padding:6px 0">No medicines added.</div>';
}
async function consultSave(aid){
  const rx=rxLines.filter(l=>l.name&&l.qty>0).map(l=>({
    name:l.name,
    dosage:l.dosage||'',
    freq: l.freqPreset==='custom' ? (l.freqCustomText||'') : (l.freqPreset||''),
    duration: l.durationNum ? `${l.durationNum} ${rxUnitLabel(l.durationNum,l.durationUnit||'days')}` : '',
    food:'After food',
    qty:l.qty,
    note:'',
    notInStock: !!l.notInStock,
  }));
  try{
    await apiPost(`/appointments/${aid}/consultation`,{complaints:$('#c-comp').value,observations:$('#c-obs').value,diagnosis:$('#c-diag').value,tests:$('#c-tests').value,treatmentReco:$('#c-treat').value,nextVisit:$('#c-next').value,rx});
    closeModal(); render();
  }catch(e){ $('#csErr').innerHTML=`<div class="err">${esc(e.message)}</div>`; }
}

  const rows = pharmacyQueueCache.map((a,i)=>{const p=a.patient;

    return `<tr class="${i===0?'hl':''}"><td>${i===0?'<span class="tag amber">Latest</span>':''}</td>

      <td style="text-align:right"><button class="btn sm" onclick="dispenseUI('${a.id}')">Open & bill</button></td></tr>`;
  }).join('');
  return `<div class="page-h"><div><h1>Prescription queue</h1><p>New scripts from the doctor. Latest is highlighted.</p></div></div>
    <div class="card"><div class="t-wrap"><table><thead><tr><th></th><th>Patient</th><th>Items</th><th>Received</th><th></th></tr></thead>
    <tbody>${rows||`<tr><td colspan="5">${emptyRow('No prescriptions waiting.')}</td></tr>`}</tbody></table></div></div>`;
}
let dispLines=[], dispInv=[], dispPatient=null, dispExternal=[];
async function dispenseUI(aid){
  const a = pharmacyQueueCache.find(x=>x.id===aid); if(!a) return;
  dispPatient = a.patient;
  try{ dispInv = await apiGet('/inventory'); }catch(e){ alert(e.message); return; }
  // Medicines flagged "not in our pharmacy" by the doctor are informational
  // only — surfaced here so staff can tell the patient, but never billed
  // or deducted from stock through this screen.
  dispExternal = a.prescriptions.filter(r=>r.notInStock);
  dispLines = a.prescriptions.filter(r=>!r.notInStock).map(r=>{
    const batches = dispInv.filter(i=>i.name===r.name).sort((x,y)=>x.expiry<y.expiry?-1:1);
    const first = batches[0]||{};
    return {name:r.name, qty:r.qty, price:first.price||0, gst:first.gst||0};
  });
  modal(`Dispense — ${esc(dispPatient.name)}`,`
    <div id="dpErr"></div>
    ${dispExternal.length?`<div class="note" style="margin-bottom:10px">Also prescribed but not stocked here — let the patient know to buy separately: <b>${dispExternal.map(r=>esc(r.name)).join(', ')}</b></div>`:''}
    <div id="dispBox"></div>
    <button class="btn ghost sm" onclick="dispAdd()">+ Add OTC / extra medicine</button>
    <div id="dispTotal" style="margin-top:18px"></div>`,
    `<button class="btn gray" onclick="closeModal()">Cancel</button>
     <button class="btn" onclick="dispenseSave('${aid}')">Generate bill & dispense</button>`,'wide');
  renderDisp();
}
function dispAdd(){dispLines.push({name:'',qty:1,price:0,gst:0});renderDisp()}
function dispDel(i){dispLines.splice(i,1);renderDisp()}
function dispPick(i,name){const b=dispInv.filter(x=>x.name===name).sort((x,y)=>x.expiry<y.expiry?-1:1)[0]||{};dispLines[i].name=name;dispLines[i].price=b.price||0;dispLines[i].gst=b.gst||0;renderDisp()}
function renderDisp(){
  const opts=distinctNames(dispInv).map(n=>`<option value="${esc(n)}">${esc(n)} (stock ${groupQty(dispInv,n)})</option>`).join('');
  $('#dispBox').innerHTML=`<table><thead><tr><th>Medicine</th><th>Stock</th><th style="width:90px">Qty</th><th>Rate</th><th>GST%</th><th>Amount</th><th></th></tr></thead><tbody>${
    dispLines.map((l,i)=>{const stock=groupQty(dispInv,l.name);const amt=(l.qty||0)*(l.price||0);const low=l.qty>stock;
    return `<tr>
      <td>${l.name?`${esc(l.name)}`:`<select onchange="dispPick(${i},this.value)"><option value="">Select…</option>${opts}</select>`}</td>
      <td style="${low?'color:var(--alert);font-weight:700':''}">${stock}</td>
      <td><input type="number" min="1" value="${l.qty||''}" oninput="dispLines[${i}].qty=+this.value;renderDisp()"></td>
      <td class="mono">${money(l.price)}</td><td>${l.gst}%</td><td class="mono">${money(amt)}</td>
      <td><button class="btn danger sm" style="padding:6px 9px" onclick="dispDel(${i})">✕</button></td></tr>`}).join('')
  }</tbody></table>`;
  const sub=dispLines.reduce((s,l)=>s+(l.qty||0)*(l.price||0),0);
  const gst=dispLines.reduce((s,l)=>s+(l.qty||0)*(l.price||0)*(l.gst||0)/100,0);
  $('#dispTotal').innerHTML=`<div class="card" style="max-width:280px;margin-left:auto"><div class="card-b">
    <div class="kv"><span class="k">Subtotal</span><span class="mono">${money(sub)}</span></div>
    <div class="kv"><span class="k">GST</span><span class="mono">${money(gst)}</span></div>
    <div class="kv" style="border:none;font-weight:700;font-size:16px"><span>Total</span><span class="mono">${money(sub+gst)}</span></div></div></div>`;
}
async function dispenseSave(aid){
  const lines=dispLines.filter(l=>l.name&&l.qty>0).map(l=>({name:l.name,qty:l.qty}));
  if(!lines.length){ $('#dpErr').innerHTML=`<div class="err">Add at least one medicine.</div>`; return; }
  try{
    const bill = await apiPost(`/appointments/${aid}/dispense`,{lines,mode:'Cash'});
    closeModal(); showBill(bill);
  }catch(e){ $('#dpErr').innerHTML=`<div class="err">${esc(e.message)}</div>`; }
}
function showBill(bill){
  const p=dispPatient||{name:'—',mobile:''};
  modal('Pharmacy bill',`<div class="print-area bill">
    <h4>${esc(branding.clinicName)} Pharmacy</h4>
    <div style="color:var(--muted);font-size:12px;margin-bottom:12px">Invoice ${esc(bill.id)} · ${new Date().toLocaleString('en-IN')}</div>
    <div>Patient: <b>${esc(p.name)}</b> · ${esc(p.mobile)}</div>
    <table style="margin:14px 0"><thead><tr><th>Item</th><th>Qty</th><th>Rate</th><th>GST</th><th style="text-align:right">Amount</th></tr></thead>
    <tbody>${bill.items.map(it=>`<tr><td>${esc(it.name)}</td><td>${it.qty}</td><td>${money(it.rate)}</td><td>${it.gst}%</td><td style="text-align:right">${money(it.amount)}</td></tr>`).join('')}</tbody></table>
    <div class="kv"><span>Subtotal</span><span>${money(bill.subtotal)}</span></div>
    <div class="kv"><span>GST</span><span>${money(bill.gst)}</span></div>
    <div class="kv" style="font-weight:700;font-size:15px"><span>Total (Paid · ${esc(bill.mode)})</span><span>${money(bill.total)}</span></div>
    <p style="text-align:center;color:var(--muted);font-size:11px;margin-top:16px">Stock updated automatically (FEFO). Thank you.</p>
  </div>`,
  `<button class="btn gray no-print" onclick="closeModal();render()">Close</button><button class="btn no-print" onclick="window.print()">Print bill</button>`);
}

async function treatUI(aid){

  let treatments;
  try{ treatments = await apiGet('/treatments'); }catch(e){ alert(e.message); return; }
  const reco = treatments.find(t=>t.name===(a.visit&&a.visit.treatmentReco));
  modal(`Record treatment — ${esc(a.patient.name)}`,`
    <div id="trErr"></div>
    <div class="field"><label>Treatment performed</label>
      <select id="t-sel" onchange="treatFee()">${treatments.map(t=>`<option value="${t.id}" data-fee="${t.cost}" ${reco&&reco.id===t.id?'selected':''}>${esc(t.name)} — ${money(t.cost)}</option>`).join('')}</select></div>
    <div class="row"><div class="field"><label>Treatment fee (₹)</label><input type="number" id="t-fee" value="${reco?reco.cost:(treatments[0]?treatments[0].cost:0)}"></div>
      <div class="field"><label>Book next visit</label><input type="date" id="t-next" min="${todayISO()}"></div></div>
    <div class="note">The fee flows to reception for collection; status becomes <b>Awaiting Payment</b>.</div>`,
    `<button class="btn gray" onclick="closeModal()">Cancel</button><button class="btn" onclick="treatSave('${aid}')">Save treatment</button>`);
}
function treatFee(){const o=$('#t-sel').selectedOptions[0];$('#t-fee').value=o.dataset.fee}
async function treatSave(aid){
  try{
    await apiPost(`/appointments/${aid}/treatment`,{treatmentId:$('#t-sel').value, fee:+$('#t-fee').value, nextVisit:$('#t-next').value||null});
    closeModal(); render();
  }catch(e){ $('#trErr').innerHTML=`<div class="err">${esc(e.message)}</div>`; }
}

/* ==========================================================================
   VIEW: INVENTORY
   ========================================================================== */
async function viewInventory(){
  const inv = await apiGet('/inventory');
  const settings = session.role==='admin' ? await apiGet('/admin/settings').catch(()=>({nearExpiryDays:60})) : {nearExpiryDays:60};
  const near = Number(settings.nearExpiryDays)||60;
  const rows = inv.slice().sort((a,b)=>a.name<b.name?-1:1).map(i=>{
    const totalForName = groupQty(inv,i.name);
    const low = totalForName<=i.reorder, dexp=daysUntil(i.expiry), exp=dexp<=near;
    return `<tr>
      <td><b>${esc(i.name)}</b></td><td class="mono">${esc(i.batch)}</td>
      <td class="mono">${fmtDate(i.expiry)} ${exp?`<span class="tag red">${dexp<0?'expired':dexp+'d'}</span>`:''}</td>
      <td class="mono" style="${low?'color:var(--alert);font-weight:700':''}">${i.qty}</td>
      <td class="mono">${money(i.cost)}</td><td class="mono">${money(i.price)}</td><td>${i.gst}%</td>
      <td>${low?'<span class="tag red">Low</span>':'<span class="tag">OK</span>'}</td>
      <td style="text-align:right"><button class="btn sm gray" onclick="purchaseUI('${i.id}')">+ Stock</button></td></tr>`;
  }).join('');
  const lowCount = distinctNames(inv).filter(n=>groupQty(inv,n)<=(inv.find(i=>i.name===n).reorder)).length;
  const expCount = inv.filter(i=>daysUntil(i.expiry)<=near).length;
  return `<div class="page-h"><div><h1>Inventory</h1><p>Batch-wise stock. Dispensing deducts oldest expiry first (FEFO).</p></div>
    <button class="btn" onclick="addMedUI()">+ Add medicine</button></div>
    <div class="grid g3" style="margin-bottom:18px">
      <div class="stat"><div class="k">Distinct medicines</div><div class="v">${distinctNames(inv).length}</div></div>
      <div class="stat ${lowCount?'warn':''}"><div class="k">Low-stock alerts</div><div class="v">${lowCount}</div></div>
      <div class="stat ${expCount?'danger':''}"><div class="k">Near / past expiry</div><div class="v">${expCount}</div></div>
    </div>
    <div class="card"><div class="t-wrap"><table><thead><tr><th>Medicine</th><th>Batch</th><th>Expiry</th><th>Qty</th><th>Cost</th><th>MRP</th><th>GST</th><th>Status</th><th></th></tr></thead>
    <tbody>${rows}</tbody></table></div></div>`;
}
function addMedUI(){
  modal('Add medicine / batch',`
    <div id="amErr"></div>
    <div class="field"><label>Medicine name</label><input id="m-name"></div>
    <div class="row"><div class="field"><label>Batch no.</label><input id="m-batch"></div>
    <div class="field"><label>Expiry date</label><input type="date" id="m-exp"></div></div>
    <div class="row"><div class="field"><label>Quantity</label><input type="number" id="m-qty"></div>
    <div class="field"><label>Reorder level</label><input type="number" id="m-re" value="20"></div></div>
    <div class="row"><div class="field"><label>Purchase cost (₹)</label><input type="number" id="m-cost"></div>
    <div class="field"><label>Selling price (₹)</label><input type="number" id="m-price"></div>
    <div class="field"><label>GST %</label><input type="number" id="m-gst" value="12"></div></div>
    <div class="field"><label>Supplier</label><input id="m-sup"></div>`,
    `<button class="btn gray" onclick="closeModal()">Cancel</button><button class="btn" onclick="addMedSave()">Add to stock</button>`);
}
async function addMedSave(){
  const g=id=>$(id).value;
  if(!g('#m-name')||!g('#m-qty')){ $('#amErr').innerHTML=`<div class="err">Name and quantity required.</div>`; return; }
  try{
    await apiPost('/inventory',{name:g('#m-name').trim(),batch:g('#m-batch')||'—',expiry:g('#m-exp')||addDays(todayISO(),365),
      qty:+g('#m-qty'),cost:+g('#m-cost')||0,price:+g('#m-price')||0,gst:+g('#m-gst')||0,reorder:+g('#m-re')||20,supplier:g('#m-sup')||'—'});
    closeModal(); render();
  }catch(e){ $('#amErr').innerHTML=`<div class="err">${esc(e.message)}</div>`; }
}
function purchaseUI(id){
  modal(`Add stock`,`<div id="puErr"></div><div class="field"><label>Quantity received</label><input type="number" id="p-qty"></div>`,
    `<button class="btn gray" onclick="closeModal()">Cancel</button><button class="btn" onclick="purchaseSave('${id}')">Add</button>`);
}
async function purchaseSave(id){
  const q=+$('#p-qty').value;
  if(!(q>0)){ $('#puErr').innerHTML=`<div class="err">Enter a quantity greater than 0.</div>`; return; }
  try{ await apiPost(`/inventory/${id}/restock`,{qty:q}); closeModal(); render(); }catch(e){ $('#puErr').innerHTML=`<div class="err">${esc(e.message)}</div>`; }
}

/* ==========================================================================
   VIEW: ADMIN
   ========================================================================== */
/* Dashboard: an option bar of tabs (Patients / Treatment / Fees / Stock) —
   click one to drill into that category. Patients/Treatment/Fees each also
   get a Today / MTD / YTD range toggle; Stock is always a live snapshot. */
const DASH_TABS = [['patients','Patients'],['treatment','Treatment'],['fees','Fees'],['stock','Stock']];
const DASH_RANGES = [['today','Today'],['mtd','MTD'],['ytd','YTD']];
function setDashTab(tab){ state.dashTab=tab; render(); }
function setDashRange(r){ state.dashRange=r; render(); }

function dashBucketGrid(b){
  return `<div class="grid g5" style="margin-bottom:18px">
    <div class="stat"><div class="k">Total appointments</div><div class="v">${b.total}</div></div>
    <div class="stat"><div class="k">Visited</div><div class="v">${b.visited}</div></div>
    <div class="stat"><div class="k">Checked-in</div><div class="v">${b.checkedIn}</div></div>
    <div class="stat ${b.waiting?'warn':''}"><div class="k">Waiting</div><div class="v">${b.waiting}</div></div>
    <div class="stat"><div class="k">Expected</div><div class="v">${b.expected}</div></div>
  </div>`;
}

async function viewDash(){
  if(!state.dashTab) state.dashTab='patients';
  if(!state.dashRange) state.dashRange='today';
  const d = await apiGet(`/admin/dashboard?range=${state.dashRange}`);

  const tabBar = `<div class="seg" style="margin-bottom:16px">${DASH_TABS.map(([k,label])=>
    `<button class="${state.dashTab===k?'on':''}" onclick="setDashTab('${k}')">${label}</button>`).join('')}</div>`;
  const rangeBar = state.dashTab==='stock' ? '' : `<div class="toolbar" style="margin-bottom:18px"><div class="seg">${DASH_RANGES.map(([k,label])=>
    `<button class="${state.dashRange===k?'on':''}" onclick="setDashRange('${k}')">${label}</button>`).join('')}</div>
    <span style="color:var(--muted);font-size:13px">${fmtDate(d.start)}${d.start!==d.end?` – ${fmtDate(d.end)}`:''}</span></div>`;

  let body = '';
  if(state.dashTab==='patients'){
    const purposes = Object.entries(d.patients.byPurpose);
    const maxP = Math.max(1,...purposes.map(([,v])=>v));
    body = `${dashBucketGrid(d.patients)}
      <div class="card"><div class="card-h">By visit purpose</div><div class="card-b">
        ${purposes.map(([k,v])=>`<div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px"><span>${esc(k)}</span><b>${v}</b></div>
          <div style="height:8px;background:var(--bg);border-radius:6px;overflow:hidden"><div style="height:100%;width:${v/maxP*100}%;background:var(--teal);border-radius:6px"></div></div></div>`).join('')}
      </div></div>`;
  } else if(state.dashTab==='treatment'){
    body = `${dashBucketGrid(d.treatment)}
      <div class="note">Scoped to appointments the doctor has flagged for treatment.</div>`;
  } else if(state.dashTab==='fees'){
    const f = d.fees;
    body = `<div class="grid g3" style="margin-bottom:18px">
        <div class="stat"><div class="k">Collected</div><div class="v mono">${money(f.collected)}</div></div>
        <div class="stat ${f.pending?'warn':''}"><div class="k">Pending (outstanding)</div><div class="v mono">${money(f.pending)}</div></div>
        <div class="stat"><div class="k">Today's total earning</div><div class="v mono">${money(f.todayEarning)}</div></div>
      </div>
      <div class="card"><div class="card-h">Earning split</div><div class="card-b">
        <div class="grid g3">
          <div class="stat"><div class="k">Doctor visiting charges</div><div class="v mono" style="font-size:20px">${money(f.doctorEarning)}</div></div>
          <div class="stat"><div class="k">Treatment fee</div><div class="v mono" style="font-size:20px">${money(f.treatmentEarning)}</div></div>
          <div class="stat"><div class="k">Medical (pharmacy) fee</div><div class="v mono" style="font-size:20px">${money(f.medicalEarning)}</div></div>
        </div>
      </div></div>`;
  } else { // stock
    const s = d.stock;
    body = `<div class="grid g3" style="margin-bottom:18px">
        <div class="stat ${(s.lowStock.length||s.nearExpiry.length)?'danger':''}"><div class="k">Stock alerts</div><div class="v">${s.lowStock.length+s.nearExpiry.length}</div></div>
        <div class="stat ${s.lowStock.length?'warn':''}"><div class="k">Low stock items</div><div class="v">${s.lowStock.length}</div></div>
        <div class="stat ${s.nearExpiry.length?'warn':''}"><div class="k">Near / past expiry</div><div class="v">${s.nearExpiry.length}</div></div>
      </div>
      <div class="card"><div class="card-h">Stock alerts</div><div class="card-b">
        ${s.lowStock.length?`<div style="margin-bottom:10px"><b style="color:var(--alert)">Low stock</b><ul style="margin:6px 0 0 18px;font-size:13px">${s.lowStock.map(n=>`<li>${esc(n.name)} — ${n.qty} left</li>`).join('')}</ul></div>`:''}
        ${s.nearExpiry.length?`<div><b style="color:var(--wait)">Near / past expiry</b><ul style="margin:6px 0 0 18px;font-size:13px">${s.nearExpiry.map(i=>`<li>${esc(i.name)} (${esc(i.batch)}) — ${fmtDate(i.expiry)}</li>`).join('')}</ul></div>`:''}
        ${(!s.lowStock.length&&!s.nearExpiry.length)?emptyRow('All stock healthy.'):''}
      </div></div>`;
  }

  return `<div class="page-h"><div><h1>Dashboard</h1><p>Today · ${fmtDate(d.date)}</p></div></div>
    ${tabBar}${rangeBar}${body}`;
}
async function viewTreatMaster(){
  const list = await apiGet('/treatments?all=1');
  const rows = list.map(t=>`<tr><td><b>${esc(t.name)}</b></td><td class="mono">${money(t.cost)}</td>
    <td>${t.active?'<span class="tag">Active</span>':'<span class="tag red">Off</span>'}</td>
    <td style="text-align:right"><button class="btn sm gray" onclick="editTreat('${t.id}')">Edit</button> <button class="btn sm danger" onclick="toggleTreat('${t.id}')">${t.active?'Disable':'Enable'}</button></td></tr>`).join('');
  return `<div class="page-h"><div><h1>Treatment master</h1><p>Set the treatments and their costs. Used by doctor & treatment centre.</p></div>
    <button class="btn" onclick="editTreat()">+ Add treatment</button></div>
    <div class="card"><div class="t-wrap"><table><thead><tr><th>Treatment</th><th>Cost</th><th>Status</th><th></th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
}
async function editTreat(id){
  let t = {name:'',cost:''};
  if(id){ const list=await apiGet('/treatments?all=1'); t = list.find(x=>x.id===id) || t; }
  modal(id?'Edit treatment':'Add treatment',`
    <div id="etErr"></div>
    <div class="field"><label>Treatment name</label><input id="tt-name" value="${esc(t.name)}"></div>
    <div class="field"><label>Cost (₹)</label><input type="number" id="tt-cost" value="${t.cost}"></div>`,
    `<button class="btn gray" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveTreat('${id||''}')">Save</button>`);
}
async function saveTreat(id){
  const name=$('#tt-name').value.trim(), cost=+$('#tt-cost').value;
  if(!name){ $('#etErr').innerHTML=`<div class="err">Name required.</div>`; return; }
  try{
    if(id) await apiPut(`/treatments/${id}`,{name,cost});
    else await apiPost('/treatments',{name,cost});
    closeModal(); render();
  }catch(e){ $('#etErr').innerHTML=`<div class="err">${esc(e.message)}</div>`; }
}
async function toggleTreat(id){ try{ await apiPatch(`/treatments/${id}/toggle`); render(); }catch(e){ alert(e.message); } }

async function viewUsers(){
  const list = await apiGet('/admin/users');
  const rows = list.map(u=>`<tr><td><b>${esc(u.name)}</b></td><td class="mono">${esc(u.username)}</td><td><span class="tag">${esc(u.role)}</span></td>
    <td>${u.active?'<span class="tag">Active</span>':'<span class="tag red">Disabled</span>'}</td>
    <td style="text-align:right"><button class="btn sm gray" onclick="toggleUserUI('${u.id}')">${u.active?'Disable':'Enable'}</button></td></tr>`).join('');
  return `<div class="page-h"><div><h1>Users & roles</h1><p>Each staff member signs in with their own username & password.</p></div>
    <button class="btn" onclick="addUserUI()">+ Add staff user</button></div>
    <div class="card"><div class="t-wrap"><table><thead><tr><th>Name</th><th>Username</th><th>Role</th><th>Status</th><th></th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
}
function addUserUI(){
  modal('Add staff user',`
    <div id="auErr"></div>
    <div class="field"><label>Full name</label><input id="u-name"></div>
    <div class="field"><label>Username</label><input id="u-user"></div>
    <div class="field"><label>Temporary password</label><input id="u-pass" type="text" placeholder="min. 6 characters"></div>
    <div class="field"><label>Role</label><select id="u-role">
      <option value="reception">Reception</option><option value="doctor">Doctor</option>
      <option value="pharmacy">Pharmacy</option><option value="treatment">Treatment Centre</option><option value="admin">Admin</option>
    </select></div>`,
    `<button class="btn gray" onclick="closeModal()">Cancel</button><button class="btn" onclick="addUserSave()">Create user</button>`);
}
async function addUserSave(){
  try{
    await apiPost('/admin/users',{name:$('#u-name').value.trim(), username:$('#u-user').value.trim(), password:$('#u-pass').value, role:$('#u-role').value});
    closeModal(); render();
  }catch(e){ $('#auErr').innerHTML=`<div class="err">${esc(e.message)}</div>`; }
}
async function toggleUserUI(id){ try{ await apiPatch(`/admin/users/${id}/toggle`); render(); }catch(e){ alert(e.message); } }

async function viewSettings(){
  const [s, br] = await Promise.all([apiGet('/admin/settings'), apiGet('/branding')]);
  return `<div class="page-h"><div><h1>Settings</h1><p>Clinic-wide defaults, branding, appointment reminders and billing/inventory alerts.</p></div></div>
    <div class="grid g2" style="align-items:start">
      <div class="card"><div class="card-h">Branding</div><div class="card-b">
        <div id="brErr"></div>
        ${br.logoUrl?`<img class="logo-preview" src="${esc(br.logoUrl)}" alt="Current logo">`:`<p style="color:var(--muted);font-size:12.5px;margin-bottom:12px">No logo uploaded yet — the app currently shows a text mark instead.</p>`}
        <div class="field"><label>Clinic display name</label><input id="s-name" value="${esc(s.clinicName||'ClinicFlow')}"></div>
        <div class="field"><label>Logo image (PNG, JPG, WEBP or SVG · max 2MB)</label><input type="file" id="s-logo" accept="image/png,image/jpeg,image/webp,image/svg+xml"></div>
        <div class="field">
          <label>Accent color</label>
          <div class="row" style="align-items:center;gap:10px">
            <input type="color" id="s-color" value="${esc(br.accentColor||DEFAULT_ACCENT)}" data-initial="${esc(br.accentColor||DEFAULT_ACCENT)}" style="width:52px;height:36px;padding:2px;flex:none">
            <span style="font-size:12.5px;color:var(--muted)">${br.accentColor?'Auto-detected from your logo — pick a different one anytime.':'Uploading a logo will auto-suggest a color, or pick your own now.'}</span>
          </div>
          <button type="button" class="btn gray" style="margin-top:8px" onclick="resetAccentColor()">Reset to default</button>
        </div>
        <div class="row">
          <button class="btn" onclick="saveBranding()">Save branding</button>
          ${br.logoUrl?`<button class="btn danger" onclick="removeLogo()">Remove logo</button>`:''}
        </div>
      </div></div>
      <div class="card"><div class="card-h">Operational defaults</div><div class="card-b">
        <div id="stErr"></div>
        <div class="field"><label>Consultation fee (₹)</label><input type="number" id="s-fee" value="${esc(s.consultationFee||500)}"></div>
        <div class="field"><label>Near-expiry alert window (days)</label><input type="number" id="s-exp" value="${esc(s.nearExpiryDays||60)}"></div>
        <button class="btn" onclick="saveSettings()">Save settings</button>
      </div></div>
      <div class="card"><div class="card-h">Appointment reminders</div><div class="card-b">
        <div id="rmErr"></div>
        <div id="rmMsg"></div>
        <p style="color:var(--muted);font-size:12.5px;margin-bottom:12px">An internal alert email is sent here — not to the patient — for every appointment, once the day before and again the same morning at 10:00 AM, listing the customer's name, phone number and reason for the visit.</p>
        <div class="field"><label>Reminder alert email</label><input type="email" id="s-remind" placeholder="you@yourclinic.com" value="${esc(s.reminderEmail||'')}"></div>
        <div class="row">
          <button class="btn" onclick="saveReminderEmail()">Save</button>
          <button class="btn gray" onclick="sendTestReminders()">Send test now</button>
        </div>
      </div></div>
    </div>`;
}
async function saveSettings(){
  try{
    await apiPut('/admin/settings',{consultationFee:+$('#s-fee').value, nearExpiryDays:+$('#s-exp').value});
    render();
  }catch(e){ $('#stErr').innerHTML=`<div class="err">${esc(e.message)}</div>`; }
}
async function saveBranding(){
  try{
    const name = $('#s-name').value.trim() || 'ClinicFlow';
    await apiPut('/admin/settings',{clinicName:name});
    const file = $('#s-logo').files[0];
    if(file){
      const fd = new FormData(); fd.append('logo', file);
      const headers = {}; if(session && session.token) headers['Authorization'] = 'Bearer ' + session.token;
      const res = await fetch(API_BASE+'/branding/logo', {method:'POST', headers, body:fd});
      let data = null; try{ data = await res.json(); }catch(e){}
      if(!res.ok) throw new Error((data && data.error) || 'Logo upload failed.');
    }
    // Only push a manual color override if the admin actually changed the
    // picker in this save — otherwise leave whatever the logo upload above
    // just auto-detected (or the previously saved color) untouched.
    const colorInput = $('#s-color');
    if(colorInput && colorInput.value.toLowerCase() !== (colorInput.dataset.initial||'').toLowerCase()){
      await apiPut('/branding/color', {accentColor: colorInput.value});
    }
    await loadBranding(); render();
  }catch(e){ $('#brErr').innerHTML=`<div class="err">${esc(e.message)}</div>`; }
}
async function resetAccentColor(){
  try{ await apiPut('/branding/color', {accentColor:''}); await loadBranding(); render(); }catch(e){ alert(e.message); }
}
async function removeLogo(){
  try{ await api('DELETE','/branding/logo'); await loadBranding(); render(); }catch(e){ alert(e.message); }
}
async function saveReminderEmail(){
  try{
    await apiPut('/admin/settings',{reminderEmail:$('#s-remind').value.trim()});
    $('#rmMsg').innerHTML = `<div class="note">Saved.</div>`;
  }catch(e){ $('#rmErr').innerHTML=`<div class="err">${esc(e.message)}</div>`; }
}
async function sendTestReminders(){
  $('#rmMsg').innerHTML = '';
  try{
    const result = await apiPost('/admin/reminders/run-now');
    const total = (result.tomorrow?.checked||0) + (result.today?.checked||0);
    $('#rmMsg').innerHTML = total
      ? `<div class="note">Checked ${total} appointment(s) for today/tomorrow — reminders sent (or logged to the server console if no email provider is configured yet).</div>`
      : `<div class="note">No appointments booked for today or tomorrow to remind about.</div>`;
  }catch(e){ $('#rmErr').innerHTML=`<div class="err">${esc(e.message)}</div>`; }
}

/* boot */
boot();
</script>
</body>
</html>
